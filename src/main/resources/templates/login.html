<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .serif-hero {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="bg-gray-50">
<div class="px-8 md:px-24 lg:px-32 h-screen flex flex-col justify-center">
    <div class="flex flex-col lg:flex-row gap-8 lg:gap-16 items-center">
        <img src="https://i.postimg.cc/3NdgN8m9/hero-image.jpg" alt=""
             class="rounded-2xl filter grayscale w-full lg:w-2/6 h-64 md:h-80 lg:h-[calc(100vh-50px*2)] object-cover">

        <div class="flex flex-col justify-center gap-10 w-full lg:w-3/6">
            <div class="flex flex-col gap-6">
                <h1 class="serif-hero text-4xl md:text-6xl lg:text-8xl text-gray-900 tracking-wider leading-tight">
                    Start with the <span class="text-red-500">why</span> !
                </h1>
                <p class="text-gray-700 text-base md:text-lg">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut
                    labore et dolore magna aliqua.
                    Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo
                    consequat.
                </p>
            </div>

            <a href="/oauth2/authorization/casdoor" class="self-start">
                <button
                        class="bg-gray-900 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-md shadow-md
                               hover:shadow-xl transition duration-300 ease-in-out flex items-center gap-2 text-sm md:text-base">

                    Take the First Step
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
